[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-sentinel"
version = "0.2.0"
description = "Self-hosted HTTP monitoring with a local dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "httpx==0.28.1",
  "cryptography>=46,<51", "httpcore==1.0.9", "pydantic>=2.9,<3", "python-dotenv>=1,<2",
  "SQLAlchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_sentinel = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/api_sentinel"]
check_untyped_defs = true
warn_unused_ignores = true
