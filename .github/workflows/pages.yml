name: Deploy dashboard to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public endpoint only. NEVER put SENTINEL_API_KEY in a VITE variable.
      VITE_API_BASE_URL: ${{ vars.SENTINEL_API_BASE_URL }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require API address
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo 'Set repository variable SENTINEL_API_BASE_URL to https://your-api-host/api/v1 first.'
            exit 1
          fi
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build:pages --prefix frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
