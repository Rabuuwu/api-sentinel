name: tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:test-only-password@127.0.0.1:5432/sentinel_test
      SENTINEL_TEST_DATABASE_URL: postgresql+asyncpg://sentinel:test-only-password@127.0.0.1:5432/sentinel_test
      SENTINEL_API_KEY: ci-test-only-key-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser E2E against isolated test database
        env:
          SENTINEL_E2E_ISOLATED: '1'
          SENTINEL_E2E_URL: http://127.0.0.1:8000
          SENTINEL_E2E_KEY: ci-test-only-key-not-a-production-secret
        run: |
          uvicorn api_sentinel.app:create_app --factory --host 127.0.0.1 --port 8000 --no-access-log > /tmp/sentinel-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health/ready && break
            sleep 1
          done
          npm run test:e2e --prefix frontend
